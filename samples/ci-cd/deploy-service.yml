# ─────────────────────────────────────────────────────────────────────────────
# Reusable Service Deployment Workflow
#
# This workflow is called by per-service deploy workflows (deploy-identity.yml,
# deploy-catalog.yml, etc.) via `workflow_call`. It handles the complete
# deployment lifecycle:
#
#   1. Build DatabaseMigrator image and push to registry
#   2. Run migrations as a Kubernetes Job (blocks until complete)
#   3. Build service Docker image and push to registry
#   4. Deploy to staging with rolling update
#   5. Run smoke tests against staging
#   6. Wait for manual approval (production deploy)
#   7. Deploy to production with rolling update
#
# Usage from a calling workflow:
#
#   jobs:
#     deploy:
#       uses: ./.github/workflows/deploy-service.yml
#       with:
#         service_name: identity
#         service_path: src/Services/Identity/Identity.API
#       secrets: inherit
#
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Service (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Short name of the service (e.g. identity, catalog)'
        required: true
        type: string
      service_path:
        description: 'Path to the service project (e.g. src/Services/Identity/Identity.API)'
        required: true
        type: string
      environment:
        description: 'Target environment: staging or production'
        required: false
        type: string
        default: 'both'     # 'both' = staging then production
      skip_migrations:
        description: 'Skip running database migrations (use only if no schema changes)'
        required: false
        type: boolean
        default: false
    secrets:
      REGISTRY_URL:
        description: 'Container registry URL (e.g. registry.digitalocean.com/billing)'
        required: true
      REGISTRY_TOKEN:
        description: 'Container registry authentication token'
        required: true
      KUBECONFIG_STAGING:
        description: 'Base64-encoded kubeconfig for staging cluster'
        required: true
      KUBECONFIG_PROD:
        description: 'Base64-encoded kubeconfig for production cluster'
        required: true
      SLACK_WEBHOOK_URL:
        description: 'Slack webhook for deployment notifications'
        required: false

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build DatabaseMigrator Docker image
  # Always built (migrations may have changed even if service hasn't)
  # ─────────────────────────────────────────────────────────────────────────
  build-migrator:
    name: 🗄️ Build Database Migrator
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_migrations }}
    outputs:
      migrator_image: ${{ steps.meta.outputs.migrator_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_TOKEN }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE="${{ secrets.REGISTRY_URL }}/billing-migrator"
          TAG="${{ github.sha }}"
          echo "migrator_image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: samples/docker/Dockerfile.migrator
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build Service Docker image
  # ─────────────────────────────────────────────────────────────────────────
  build-service:
    name: 🐳 Build ${{ inputs.service_name }} Service Image
    runs-on: ubuntu-latest
    outputs:
      service_image: ${{ steps.meta.outputs.service_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_TOKEN }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE="${{ secrets.REGISTRY_URL }}/billing-${{ inputs.service_name }}"
          TAG="${{ github.sha }}"
          echo "service_image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Build and push service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: samples/docker/Dockerfile.service
          push: true
          # Pass service path as build arg so single Dockerfile serves all services
          build-args: |
            SERVICE_PATH=${{ inputs.service_path }}
            SERVICE_NAME=${{ inputs.service_name }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy to STAGING
  #   a) Run migrations as K8s Job
  #   b) Rolling deploy of service
  #   c) Smoke tests
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-migrator, build-service]
    # build-migrator is skipped if skip_migrations=true; handle both cases
    if: |
      always() &&
      needs.build-service.result == 'success' &&
      (needs.build-migrator.result == 'success' || needs.build-migrator.result == 'skipped')
    environment:
      name: staging
      url: https://staging-api.billing.app

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl (staging)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run database migrations (staging)
        if: ${{ !inputs.skip_migrations }}
        run: |
          # Create a one-off K8s Job to run migrations
          # The Job uses the freshly built migrator image
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migrate-${{ github.sha }}-staging
            namespace: billing-staging
          spec:
            ttlSecondsAfterFinished: 3600
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrator
                    image: ${{ needs.build-migrator.outputs.migrator_image }}
                    envFrom:
                      - secretRef:
                          name: billing-db-credentials
                    env:
                      - name: ASPNETCORE_ENVIRONMENT
                        value: Staging
          EOF

          # Wait for the migration Job to complete (timeout: 10 minutes)
          echo "Waiting for migration job to complete..."
          kubectl wait job/db-migrate-${{ github.sha }}-staging \
            --for=condition=complete \
            --timeout=600s \
            --namespace billing-staging

          echo "✅ Migrations completed successfully"

      - name: Rolling deploy to staging
        run: |
          # Update the image tag for this service
          kubectl set image deployment/billing-${{ inputs.service_name }} \
            ${{ inputs.service_name }}=${{ needs.build-service.outputs.service_image }} \
            --namespace billing-staging

          # Wait for rollout to complete (timeout: 5 minutes)
          kubectl rollout status deployment/billing-${{ inputs.service_name }} \
            --timeout=300s \
            --namespace billing-staging

          echo "✅ Staging deployment complete"

      - name: Run smoke tests (staging)
        run: |
          BASE_URL="https://staging-api.billing.app/api/v1/${{ inputs.service_name }}"

          echo "Running smoke tests against ${BASE_URL}..."

          # Health check endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE_URL}/health" \
            --max-time 30)

          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed with status ${STATUS}"
            exit 1
          fi

          # Readiness check endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE_URL}/ready" \
            --max-time 30)

          if [ "$STATUS" != "200" ]; then
            echo "❌ Readiness check failed with status ${STATUS}"
            exit 1
          fi

          echo "✅ Smoke tests passed"

      - name: Notify Slack (staging deployed)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *${{ inputs.service_name }}* deployed to *staging*",
              "attachments": [{
                "color": "good",
                "fields": [
                  { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                  { "title": "Actor", "value": "${{ github.actor }}", "short": true }
                ]
              }]
            }

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Manual approval gate before production deploy
  # ─────────────────────────────────────────────────────────────────────────
  approval-gate:
    name: 🔒 Await Production Approval
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'
    environment:
      name: production-approval   # Configure reviewers in GitHub Environments
    steps:
      - name: Approved for production
        run: echo "Production deployment approved by ${{ github.actor }}"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Deploy to PRODUCTION
  # ─────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-migrator, build-service, approval-gate]
    if: needs.approval-gate.result == 'success'
    environment:
      name: production
      url: https://api.billing.app

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl (production)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run database migrations (production)
        if: ${{ !inputs.skip_migrations }}
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migrate-${{ github.sha }}-prod
            namespace: billing-prod
          spec:
            ttlSecondsAfterFinished: 7200
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrator
                    image: ${{ needs.build-migrator.outputs.migrator_image }}
                    envFrom:
                      - secretRef:
                          name: billing-db-credentials
                    env:
                      - name: ASPNETCORE_ENVIRONMENT
                        value: Production
          EOF

          kubectl wait job/db-migrate-${{ github.sha }}-prod \
            --for=condition=complete \
            --timeout=600s \
            --namespace billing-prod

          echo "✅ Production migrations completed"

      - name: Rolling deploy to production
        run: |
          kubectl set image deployment/billing-${{ inputs.service_name }} \
            ${{ inputs.service_name }}=${{ needs.build-service.outputs.service_image }} \
            --namespace billing-prod

          # Rolling update: maxSurge=1, maxUnavailable=0 (configured in deployment.yml)
          kubectl rollout status deployment/billing-${{ inputs.service_name }} \
            --timeout=600s \
            --namespace billing-prod

          echo "✅ Production deployment complete"

      - name: Post-deploy health check
        run: |
          BASE_URL="https://api.billing.app/api/v1/${{ inputs.service_name }}"

          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${BASE_URL}/health" --max-time 30)

            if [ "$STATUS" == "200" ]; then
              echo "✅ Production health check passed (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i} failed (${STATUS}), retrying in 15s..."
            sleep 15
          done

          echo "❌ Production health check failed after 3 attempts"
          exit 1

      - name: Notify Slack (production deployed)
        if: always() && ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *${{ inputs.service_name }}* production deploy: *${{ job.status }}*",
              "attachments": [{
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "fields": [
                  { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                  { "title": "Actor", "value": "${{ github.actor }}", "short": true },
                  { "title": "Environment", "value": "Production", "short": true }
                ]
              }]
            }

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Rolling back to previous version..."
          kubectl rollout undo deployment/billing-${{ inputs.service_name }} \
            --namespace billing-prod
          kubectl rollout status deployment/billing-${{ inputs.service_name }} \
            --timeout=300s \
            --namespace billing-prod
          echo "↩️ Rollback complete"
